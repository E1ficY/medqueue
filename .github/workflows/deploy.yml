name: MedQueue Deploy

on:
  push:
    branches: ["staging", "main"]
  workflow_dispatch:

concurrency:
  group: medqueue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to Staging Server
        if: ${{ env.STAGING_HOST != '' && env.STAGING_USER != '' && env.STAGING_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.STAGING_HOST }}
          username: ${{ env.STAGING_USER }}
          key: ${{ env.STAGING_SSH_KEY }}
          script: |
            cd /opt/medqueue
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            git clean -fd
            # Run migrations on the remote before restarting services
            docker compose -f startup/docker-compose.yml run --rm backend python manage.py migrate --noinput || true
            docker compose -f startup/docker-compose.yml up -d --build
            echo "Staging deployment completed successfully"

      - name: Skip staging deploy when secrets missing
        if: ${{ env.STAGING_HOST == '' || env.STAGING_USER == '' || env.STAGING_SSH_KEY == '' }}
        run: |
          echo "Staging deploy secrets not configured. Set them in GitHub Settings > Secrets > Actions:"
          echo "  - STAGING_HOST"
          echo "  - STAGING_USER"
          echo "  - STAGING_SSH_KEY"
          exit 0

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to Production Server
        if: ${{ env.PROD_HOST != '' && env.PROD_USER != '' && env.PROD_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PROD_HOST }}
          username: ${{ env.PROD_USER }}
          key: ${{ env.PROD_SSH_KEY }}
          script: |
            cd /opt/medqueue
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd
            # Run migrations on the remote before restarting services
            docker compose -f startup/docker-compose.yml run --rm backend python manage.py migrate --noinput || true
            docker compose -f startup/docker-compose.yml up -d --build
            echo "Production deployment completed successfully"

      - name: Skip production deploy when secrets missing
        if: ${{ env.PROD_HOST == '' || env.PROD_USER == '' || env.PROD_SSH_KEY == '' }}
        run: |
          echo "Production deploy secrets not configured. Set them in GitHub Settings > Secrets > Actions:"
          echo "  - PROD_HOST"
          echo "  - PROD_USER"
          echo "  - PROD_SSH_KEY"
          exit 0
