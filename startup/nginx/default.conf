server {
    listen 80;
    server_name medqueue.me www.medqueue.me _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://medqueue.me$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name medqueue.me www.medqueue.me _;

    ssl_certificate /etc/letsencrypt/live/medqueue.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medqueue.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://www.paypal.com https://www.sandbox.paypal.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://upload.wikimedia.org https://www.paypalobjects.com https://*.tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org; connect-src 'self' https://challenges.cloudflare.com https://api.paypal.com https://api.sandbox.paypal.com; frame-src 'self' https://challenges.cloudflare.com https://www.paypal.com https://www.sandbox.paypal.com; media-src 'self' data: blob:;" always;

    if ($host = www.medqueue.me) {
        return 301 https://medqueue.me$request_uri;
    }

    location = /favicon.ico {
        return 301 /images/favicon.svg;
    }

    location /css/ {
        alias /staticfiles/css/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /js/ {
        alias /staticfiles/js/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /images/ {
        alias /staticfiles/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /video/ {
        alias /staticfiles/video/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Serve Django's collected static files (includes admin CSS/JS)
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
