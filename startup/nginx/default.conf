server {
    listen 80;
    server_name medqueue.me _;

    # Serve ACME challenge files for Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name medqueue.me _;

    ssl_certificate /etc/letsencrypt/live/medqueue.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medqueue.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    location /css/ {
        alias /staticfiles/css/;
        access_log off;
        expires 30d;
    }

    location /js/ {
        alias /staticfiles/js/;
        access_log off;
        expires 30d;
    }

    location /images/ {
        alias /staticfiles/images/;
        access_log off;
        expires 30d;
    }

    location /video/ {
        alias /staticfiles/video/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
