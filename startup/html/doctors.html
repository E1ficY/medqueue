<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MedQueue - Врачи и рейтинг</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=4.2">
  <link rel="stylesheet" href="../css/modules/logo-system.css?v=1">
  <link rel="stylesheet" href="../css/modules/navigation-system.css?v=1">
  <script src="../js/theme.js"></script>
  <script src="../js/script.js?v=1.0.8"></script>
  <style>
    .doctors-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .doctors-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
    }
    .doctors-filters input,
    .doctors-filters select {
      min-height: 42px;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--card);
      color: var(--text);
    }
    .doctors-filters input { flex: 1; min-width: 220px; }
    .doctors-filters select { min-width: 200px; }
    .doctors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .doctors-wow {
      margin-top: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(17, 17, 17, 0.14);
      border-radius: 16px;
      background:
        radial-gradient(520px 140px at 0% 0%, rgba(189,171,142,0.16), transparent 62%),
        linear-gradient(145deg, #fbf8f2, #f4efe6 56%, #faf7f1);
      color: var(--text);
      padding: 14px;
      box-shadow: 0 10px 24px rgba(15,23,42,0.1);
    }
    .doctors-wow-head {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #3f3f46;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .doctors-wow-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .doctors-wow-item {
      border: 1px solid rgba(17, 17, 17, 0.14);
      border-radius: 10px;
      padding: 8px;
      background: rgba(255,255,255,0.72);
      min-height: 64px;
    }
    .doctors-wow-item strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      color: var(--text);
    }
    .doctors-wow-item span {
      font-size: 11px;
      color: var(--text-soft);
      line-height: 1.35;
      display: block;
      margin-top: 2px;
    }
    [data-theme="dark"] .doctors-wow {
      background:
        radial-gradient(520px 140px at 0% 0%, rgba(189,171,142,0.14), transparent 62%),
        linear-gradient(145deg, rgba(19,19,19,0.96), rgba(24,24,24,0.94));
      border-color: rgba(244, 244, 244, 0.2);
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    }
    [data-theme="dark"] .doctors-wow-head {
      color: #d4d4d8;
    }
    [data-theme="dark"] .doctors-wow-item {
      background: rgba(19,19,19,0.82);
      border-color: rgba(244, 244, 244, 0.2);
    }
    [data-theme="dark"] .doctors-wow-item strong {
      color: #f8fafc;
    }
    [data-theme="dark"] .doctors-wow-item span {
      color: #cbd5e1;
    }
    #doctorsCatalogList .card {
      overflow: hidden;
    }
    #doctorsCatalogList .card * {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .doctors-catalog-scroll {
      margin-top: 16px;
      max-height: 62vh;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-gutter: stable;
    }
    .doctors-catalog-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .doctors-catalog-scroll::-webkit-scrollbar-thumb {
      background: rgba(111,156,146,0.35);
      border-radius: 999px;
    }
    @media (max-width: 768px) {
      .doctors-wow-grid {
        grid-template-columns: 1fr;
      }
      .doctors-catalog-scroll {
        max-height: 68vh;
      }
    }
  </style>
</head>
<body class="page-doctors-avant">
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="main.html" aria-label="MedQueue — главная">
        <img src="../images/logo-medqueue-mark.svg" alt="MedQueue" width="34" height="34" style="display:block;border-radius:8px;" />
        <span>MedQueue</span>
      </a>
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
      <nav id="mainNav">
        <a href="main.html" class="nav-link">Главная</a>
        <a href="doctors.html" class="nav-link active">Врачи</a>
        <a href="recording.html" class="nav-link">Записаться</a>
        <a href="recording.html#status-check" class="nav-link">Статус очереди</a>
        <a href="profile.html" class="nav-link">Личный кабинет</a>
        <a href="subscription.html" class="nav-link">Подписка</a>
      </nav>
    </div>
    <label class="theme-switch"><input type="checkbox" class="theme-checkbox" onchange="toggleTheme()"><span class="theme-slider"></span></label>
  </header>

  <main class="wrap" style="padding-top:28px; padding-bottom:40px;">
    <section class="card" style="padding:22px;">
      <div class="doctors-head">
        <div>
          <h1 style="margin:0 0 6px; font-size:28px;">Врачи и рейтинг</h1>
          <p style="margin:0; color:var(--muted);">Выберите врача по специальности, рейтингу и больнице.</p>
        </div>
      </div>

      <div class="doctors-filters">
        <input id="doctorSearch" type="text" placeholder="Поиск по ФИО или больнице..." />
        <select id="doctorSpecialtyFilter">
          <option value="all">Все специальности</option>
          <option value="Терапевт">Терапевт</option>
          <option value="Хирург">Хирург</option>
          <option value="Стоматолог">Стоматолог</option>
          <option value="Педиатр">Педиатр</option>
          <option value="Кардиолог">Кардиолог</option>
          <option value="Невролог">Невролог</option>
          <option value="Офтальмолог">Офтальмолог</option>
          <option value="Дерматолог">Дерматолог</option>
          <option value="Эндокринолог">Эндокринолог</option>
          <option value="Гинеколог">Гинеколог</option>
          <option value="Уролог">Уролог</option>
          <option value="Психиатр">Психиатр</option>
        </select>
      </div>

      <div id="doctorsWowPanel" class="doctors-wow" aria-live="polite"></div>

      <div id="doctorsCatalogList" class="doctors-grid doctors-catalog-scroll"></div>
    </section>
  </main>

  <script>
    function toggleMobileMenu() {
      const nav = document.getElementById('mainNav');
      nav.classList.toggle('mobile-open');
    }
  </script>
</body>
</html>
