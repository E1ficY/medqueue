<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MedQueue — Подписка</title>
  <meta name="description" content="Управление подпиской MedQueue. Выберите тариф и оплатите через PayPal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b1220;
      --bg2: #111827;
      --card: #161f30;
      --card2: #1a2540;
      --border: rgba(255,255,255,.07);
      --accent: #4ade80;
      --accent2: #22c55e;
      --paypal: #003087;
      --paypal2: #009cde;
      --text: #f1f5f9;
      --muted: #64748b;
      --muted2: #94a3b8;
      --plus: #f59e0b;
      --social: #818cf8;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── NAVBAR ─── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 64px;
      background: rgba(11,18,32,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -.3px;
    }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      color: var(--muted2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      transition: all .15s;
    }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .nav-link.active { color: var(--text); background: rgba(255,255,255,.08); }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted2);
    }
    .nav-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--paypal2));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
      cursor: pointer;
    }

    /* ─── LAYOUT ─── */
    .page { max-width: 1080px; margin: 0 auto; padding: 40px 20px 80px; }

    .page-hero {
      text-align: center;
      margin-bottom: 48px;
    }
    .page-hero h1 {
      font-size: 40px;
      font-weight: 800;
      background: linear-gradient(135deg, #f1f5f9 30%, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .page-hero p {
      color: var(--muted2);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── STATUS BAR ─── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 24px;
      margin-bottom: 32px;
    }
    .status-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(74,222,128,.2), rgba(34,197,94,.1));
      border: 1px solid rgba(74,222,128,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .status-info { flex: 1; }
    .status-plan {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .status-detail {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(74,222,128,.12);
      color: var(--accent);
      border: 1px solid rgba(74,222,128,.2);
    }
    .status-badge.plus { background: rgba(245,158,11,.12); color: var(--plus); border-color: rgba(245,158,11,.2); }
    .status-badge.social { background: rgba(129,140,248,.12); color: var(--social); border-color: rgba(129,140,248,.2); }

    /* ─── PLANS GRID ─── */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 768px) { .plans-grid { grid-template-columns: 1fr; } }

    .plan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color .2s, transform .2s;
      position: relative;
      overflow: hidden;
    }
    .plan-card:hover { border-color: rgba(255,255,255,.15); transform: translateY(-2px); }
    .plan-card.popular {
      border-color: rgba(245,158,11,.35);
      background: linear-gradient(145deg, #1a2540, #1e2c40);
    }
    .plan-card.active-plan { border-color: rgba(74,222,128,.35); }

    .plan-popular-badge {
      position: absolute; top: 16px; right: 16px;
      font-size: 10px; font-weight: 800;
      padding: 3px 9px; border-radius: 20px;
      background: linear-gradient(90deg, var(--plus), #f97316);
      color: #fff;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .plan-name {
      font-size: 13px; font-weight: 700;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .plan-price {
      font-size: 34px; font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .plan-price span { font-size: 14px; font-weight: 500; color: var(--muted); }

    .plan-features { list-style: none; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .plan-features li {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 13px; color: var(--muted2); line-height: 1.4;
    }
    .plan-features li::before { content: '✓'; color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .plan-card.popular .plan-features li::before { color: var(--plus); }

    .plan-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      transition: all .2s;
    }
    .plan-btn.free-btn {
      background: rgba(255,255,255,.06);
      color: var(--muted2);
      border: 1px solid var(--border);
    }
    .plan-btn.free-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
    .plan-btn.social-btn {
      background: rgba(129,140,248,.12);
      color: var(--social);
      border: 1px solid rgba(129,140,248,.25);
    }
    .plan-btn.social-btn:hover { background: rgba(129,140,248,.22); }
    .plan-btn.paypal-btn {
      background: linear-gradient(135deg, var(--paypal), #0070ba);
      color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .plan-btn.paypal-btn:hover { background: linear-gradient(135deg, #004ab3, #0070ba); transform: scale(1.02); }
    .plan-btn:disabled {
      opacity: .6; cursor: not-allowed;
      transform: none !important;
    }
    .plan-btn.active-btn {
      background: rgba(74,222,128,.1);
      color: var(--accent);
      border: 1px solid rgba(74,222,128,.25);
      cursor: default;
    }

    /* ─── PAYPAL LOGO ─── */
    .paypal-logo {
      display: inline-flex; align-items: center; gap: 3px;
      font-weight: 800; font-size: 14px;
    }
    .paypal-logo .pay { color: #009cde; }
    .paypal-logo .pal { color: #003087; }

    /* ─── SOCIAL FORM ─── */
    .social-reason-box {
      background: var(--card);
      border: 1px solid rgba(129,140,248,.25);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 32px;
      display: none;
    }
    .social-reason-box.show { display: block; }
    .social-reason-box label {
      display: block;
      font-size: 13px; font-weight: 700;
      color: var(--muted2);
      margin-bottom: 8px;
    }
    .social-reason-box textarea {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      resize: vertical;
      min-height: 80px;
    }
    .social-reason-box textarea:focus { outline: none; border-color: var(--social); }

    /* ─── RECEIPT ─── */
    .receipt-section { display: none; margin-bottom: 32px; }
    .receipt-section.show { display: block; }
    .receipt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .receipt-header {
      background: linear-gradient(90deg, var(--card2), #1a2540);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .receipt-header .title { font-size: 12px; font-weight: 800; color: var(--muted2); letter-spacing: 1px; text-transform: uppercase; }
    .receipt-body { padding: 4px 0; }
    .receipt-row {
      display: flex; justify-content: space-between;
      padding: 10px 20px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-row .label { color: var(--muted); }
    .receipt-row .value { color: var(--text); font-weight: 600; }
    .receipt-row .value.success { color: var(--accent); }

    /* ─── TOAST ─── */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 14px; font-weight: 600;
      color: var(--text);
      max-width: 340px;
      z-index: 9999;
      transform: translateY(20px);
      opacity: 0;
      transition: all .3s ease;
      display: flex; align-items: center; gap: 10px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: rgba(74,222,128,.3); }
    #toast.error { border-color: rgba(239,68,68,.3); }
    #toast .toast-icon { font-size: 18px; flex-shrink: 0; }

    /* ─── LOADING ─── */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--card);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 14px;
      color: var(--muted2);
    }
    .error-state .err-icon { font-size: 36px; margin-bottom: 12px; }
    .error-state h3 { color: var(--text); margin-bottom: 8px; }
    .error-state p { font-size: 14px; margin-bottom: 16px; }
    .retry-btn {
      padding: 10px 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s;
    }
    .retry-btn:hover { background: rgba(255,255,255,.14); }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="main.html" class="brand">MedQueue</a>
  <div class="nav-links">
    <a href="main.html" class="nav-link">Главная</a>
    <a href="appointments.html" class="nav-link">Запись</a>
    <a href="subscription.html" class="nav-link active">Подписка</a>
    <a href="profile.html" class="nav-link">Профиль</a>
  </div>
  <div class="nav-user">
    <div class="nav-avatar" id="navAvatar">?</div>
    <span id="navUserName">Загрузка...</span>
  </div>
</nav>

<div id="toast">
  <span class="toast-icon" id="toastIcon">ℹ️</span>
  <span id="toastMsg"></span>
</div>

<main class="page">
  <div class="page-hero">
    <h1>Подписка MedQueue</h1>
    <p>Выберите подходящий тариф и получите доступ к расширенным функциям платформы</p>
  </div>

  <!-- СТАТУС ТЕКУЩЕЙ ПОДПИСКИ -->
  <div class="status-bar" id="statusBar" style="display:none">
    <div class="status-icon" id="statusIcon">🏥</div>
    <div class="status-info">
      <div class="status-plan" id="statusPlan">Тариф: Free</div>
      <div class="status-detail" id="statusDetail">Загрузка...</div>
    </div>
    <div class="status-badge" id="statusBadge">Free</div>
  </div>

  <!-- ПЛАНЫ -->
  <div class="section-title">Доступные тарифы</div>
  <div id="plansContainer">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Загрузка тарифов...</div>
    </div>
  </div>

  <!-- ФОРМА ЛЬГОТНОГО ТАРИФА -->
  <div class="social-reason-box" id="socialBox">
    <label for="socialReason">Причина для льготного тарифа (минимум 12 символов)</label>
    <textarea id="socialReason" placeholder="Опишите причину (инвалидность, пенсионный возраст, многодетная семья и т.д.)..."></textarea>
  </div>

  <!-- ПОСЛЕДНИЙ ПЛАТЕЖ -->
  <div class="receipt-section" id="receiptSection">
    <div class="section-title">Последний платёж</div>
    <div class="receipt-card">
      <div class="receipt-header">
        <span>🧾</span>
        <span class="title">Квитанция об оплате</span>
      </div>
      <div class="receipt-body" id="receiptBody"></div>
    </div>
  </div>
</main>

<script>
  // ═══════════════════════════════════════════
  //  CONFIG
  // ═══════════════════════════════════════════
  const API_BASE = window.location.protocol === 'file:'
    ? (localStorage.getItem('medqueue_api_origin') || 'http://127.0.0.1:8000')
    : window.location.origin;
  const API = `${API_BASE}/api`;
  const AUTH_KEY = 'medqueue_current_user';

  let activePlanId = 'free';

  // ═══════════════════════════════════════════
  //  AUTH HELPERS
  // ═══════════════════════════════════════════
  function getUser() {
    try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }
    catch { return null; }
  }
  function saveUser(u) { localStorage.setItem(AUTH_KEY, JSON.stringify(u)); }

  async function refreshToken() {
    const u = getUser();
    if (!u?.refresh) return false;
    try {
      const r = await fetch(`${API}/auth/token/refresh/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh: u.refresh })
      });
      if (!r.ok) return false;
      const d = await r.json();
      saveUser({ ...u, access: d.access });
      return true;
    } catch { return false; }
  }

  async function apiFetch(url, opts = {}, _retry = true) {
    const u = getUser();
    const headers = {
      'Content-Type': 'application/json',
      'ngrok-skip-browser-warning': 'true',
      ...(opts.headers || {})
    };
    if (u?.access) headers.Authorization = `Bearer ${u.access}`;
    const res = await fetch(url, { ...opts, headers });
    if (res.status === 401 && _retry) {
      if (await refreshToken()) return apiFetch(url, opts, false);
      // Refresh тоже не сработал — токен полностью истёк
      localStorage.removeItem(AUTH_KEY);
      const nextPath = window.location.pathname + window.location.search;
      window.location.href = '/auth.html?tab=login&next=' + encodeURIComponent(nextPath);
    }
    return res;
  }

  // ═══════════════════════════════════════════
  //  TOAST
  // ═══════════════════════════════════════════
  let _toastTimer;
  function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    const icons = { success: '✅', error: '❌', info: 'ℹ️', warn: '⚠️' };
    document.getElementById('toastIcon').textContent = icons[type] || 'ℹ️';
    document.getElementById('toastMsg').textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ''; }, 4000);
  }

  // ═══════════════════════════════════════════
  //  RENDER PLANS
  // ═══════════════════════════════════════════
  function renderPlans(plans, currentPlanId) {
    activePlanId = currentPlanId || 'free';
    const planDefs = {
      free:   { icon: '🌱', color: 'free-btn',   label: 'Бесплатно' },
      social: { icon: '💚', color: 'social-btn', label: 'Льготный' },
      plus:   { icon: '⭐', color: 'paypal-btn',  label: 'PayPal' },
    };

    document.getElementById('plansContainer').innerHTML = `
      <div class="plans-grid">
        ${plans.map(p => {
          const isActive = p.id === activePlanId;
          const def = planDefs[p.id] || planDefs.free;
          const priceText = p.price_kzt === 0 ? 'Бесплатно' : `${p.price_kzt.toLocaleString('ru-RU')} ₸`;
          const priceSmall = p.price_kzt === 0 ? '' : '<span>/ месяц</span>';

          let btnContent, btnClass;
          if (isActive) {
            btnContent = '✓ Текущий тариф'; btnClass = 'active-btn';
          } else if (p.id === 'plus') {
            btnContent = `<span class="paypal-logo"><span class="pay">Pay</span><span class="pal">Pal</span></span>&nbsp;Оплатить`;
            btnClass = 'paypal-btn';
          } else if (p.id === 'social') {
            btnContent = 'Подтвердить льготу'; btnClass = 'social-btn';
          } else {
            btnContent = 'Выбрать'; btnClass = 'free-btn';
          }

          return `
            <div class="plan-card ${p.is_popular ? 'popular' : ''} ${isActive ? 'active-plan' : ''}">
              ${p.is_popular ? '<div class="plan-popular-badge">🔥 Популярный</div>' : ''}
              <div class="plan-name">${def.icon} ${p.title}</div>
              <div class="plan-price">${priceText}${priceSmall}</div>
              <ul class="plan-features">
                ${p.benefits.map(b => `<li>${b}</li>`).join('')}
              </ul>
              <button
                id="btn-${p.id}"
                class="plan-btn ${btnClass}"
                onclick="handlePlan('${p.id}')"
                ${isActive ? 'disabled' : ''}
              >${btnContent}</button>
            </div>
          `;
        }).join('')}
      </div>
    `;

    // Показываем поле для льготного тарифа если нужно
    const socialBox = document.getElementById('socialBox');
    socialBox.classList.toggle('show', activePlanId !== 'social');
  }

  // ═══════════════════════════════════════════
  //  RENDER STATUS BAR
  // ═══════════════════════════════════════════
  function renderStatus(sub) {
    const bar = document.getElementById('statusBar');
    bar.style.display = 'flex';

    if (!sub) {
      document.getElementById('statusPlan').textContent = 'Тариф: Free';
      document.getElementById('statusDetail').textContent = 'Активируйте тариф из списка ниже';
      document.getElementById('statusIcon').textContent = '🌱';
      document.getElementById('statusBadge').textContent = 'Free';
      document.getElementById('statusBadge').className = 'status-badge';
      return;
    }

    const icons = { free: '🌱', social: '💚', plus: '⭐' };
    document.getElementById('statusIcon').textContent = icons[sub.plan_id] || '🏥';
    document.getElementById('statusPlan').textContent = `Тариф: ${sub.plan_title}`;

    const billing = sub.next_billing_date
      ? `Следующее списание: ${new Date(sub.next_billing_date).toLocaleDateString('ru-RU')}`
      : 'Бесплатно';
    document.getElementById('statusDetail').textContent = billing;

    const badge = document.getElementById('statusBadge');
    badge.textContent = sub.plan_title;
    badge.className = `status-badge ${sub.plan_id === 'plus' ? 'plus' : sub.plan_id === 'social' ? 'social' : ''}`;
  }

  // ═══════════════════════════════════════════
  //  RENDER RECEIPT
  // ═══════════════════════════════════════════
  function renderReceipt(tx) {
    if (!tx) return;
    const section = document.getElementById('receiptSection');
    const body = document.getElementById('receiptBody');
    const method = tx.card_last4 ? `**** **** **** ${tx.card_last4}` : (tx.merchant_name || 'PayPal');
    const amount = tx.currency === 'USD'
      ? `$${Number(tx.amount).toFixed(2)} USD`
      : `${Number(tx.amount).toLocaleString('ru-RU')} ${tx.currency || 'KZT'}`;

    body.innerHTML = `
      <div class="receipt-row"><span class="label">Статус</span><span class="value success">${tx.status === 'paid' ? 'ОПЛАЧЕН ✓' : tx.status.toUpperCase()}</span></div>
      <div class="receipt-row"><span class="label">Сумма</span><span class="value">${amount}</span></div>
      <div class="receipt-row"><span class="label">Способ оплаты</span><span class="value">${method}</span></div>
      <div class="receipt-row"><span class="label">ID транзакции</span><span class="value" style="font-size:11px;word-break:break-all">${tx.transaction_ref || '—'}</span></div>
      <div class="receipt-row"><span class="label">Дата</span><span class="value">${tx.paid_at ? new Date(tx.paid_at).toLocaleString('ru-RU') : '—'}</span></div>
    `;
    section.classList.add('show');
  }

  // ═══════════════════════════════════════════
  //  HANDLE PLAN BUTTON
  // ═══════════════════════════════════════════
  async function handlePlan(planId) {
    if (planId === activePlanId) return;

    if (planId === 'plus') {
      await startPayPal();
      return;
    }

    if (planId === 'social') {
      const reason = (document.getElementById('socialReason')?.value || '').trim();
      if (reason.length < 12) {
        toast('Укажите причину минимум из 12 символов в поле ниже', 'warn');
        document.getElementById('socialBox').classList.add('show');
        document.getElementById('socialReason').focus();
        return;
      }
      await activatePlan(planId, { social_reason: reason });
      return;
    }

    await activatePlan(planId, {});
  }

  async function activatePlan(planId, extra = {}) {
    const btn = document.getElementById(`btn-${planId}`);
    if (btn) { btn.disabled = true; btn.textContent = 'Обработка...'; }

    try {
      const r = await apiFetch(`${API}/subscription/activate/`, {
        method: 'POST',
        body: JSON.stringify({ plan_id: planId, ...extra })
      });
      const d = await r.json();
      if (!r.ok) {
        toast(d.error || 'Ошибка при активации тарифа', 'error');
        if (btn) { btn.disabled = false; }
        return;
      }
      toast(d.message || 'Тариф успешно активирован!', 'success');
      await loadData();
    } catch (e) {
      toast('Ошибка подключения к серверу', 'error');
      if (btn) { btn.disabled = false; }
    }
  }

  // ═══════════════════════════════════════════
  //  PAYPAL
  // ═══════════════════════════════════════════
  async function startPayPal() {
    const btn = document.getElementById('btn-plus');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Переход к PayPal...'; }

    try {
      const r = await apiFetch(`${API}/subscription/create-paypal-order/`, {
        method: 'POST',
        body: JSON.stringify({
          plan_id: 'plus',
          success_url: window.location.href.split('?')[0] + '?pp=1',
          cancel_url: window.location.href.split('?')[0] + '?pp=cancel'
        })
      });
      const d = await r.json();
      if (!r.ok || !d.checkout_url) {
        toast(d.error || 'Не удалось создать заказ PayPal', 'error');
        if (btn) { btn.disabled = false; }
        return;
      }
      window.location.href = d.checkout_url;
    } catch (e) {
      toast('Ошибка подключения', 'error');
      if (btn) { btn.disabled = false; }
    }
  }

  async function capturePayPal(token) {
    toast('Подтверждаем платёж PayPal...', 'info');
    try {
      const r = await apiFetch(`${API}/subscription/capture-paypal-order/`, {
        method: 'POST',
        body: JSON.stringify({ token })
      });
      const d = await r.json();
      if (r.ok) {
        toast('✅ Оплата успешна! Тариф Plus активирован.', 'success');
      } else {
        toast(d.error || 'Ошибка подтверждения PayPal', 'error');
      }
    } catch {
      toast('Ошибка при подтверждении PayPal', 'error');
    }
  }

  // ═══════════════════════════════════════════
  //  LOAD DATA
  // ═══════════════════════════════════════════
  async function loadData() {
    try {
      // Грузим планы и данные подписки параллельно
      const [plansRes, meRes] = await Promise.allSettled([
        fetch(`${API}/subscription/plans/`, { headers: { 'ngrok-skip-browser-warning': 'true' } }),
        apiFetch(`${API}/subscription/me/`)
      ]);

      // Обработка планов
      let plans = [];
      if (plansRes.status === 'fulfilled' && plansRes.value.ok) {
        const data = await plansRes.value.json();
        plans = Array.isArray(data) ? data : (data.plans || []);
      } else {
        document.getElementById('plansContainer').innerHTML = `
          <div class="error-state">
            <div class="err-icon">🔌</div>
            <h3>Сервер недоступен</h3>
            <p>Убедитесь что Django сервер запущен: <code>${API_BASE}</code></p>
            <button class="retry-btn" onclick="loadData()">Повторить</button>
          </div>`;
        return;
      }

      // Обработка данных подписки
      let meData = { subscription: null, transactions: [] };
      if (meRes.status === 'fulfilled' && meRes.value.ok) {
        meData = await meRes.value.json();
      } else if (meRes.status === 'fulfilled' && meRes.value.status === 401) {
        return; // apiFetch уже сделал редирект
      }
      // Если /me/ вернул другую ошибку — грузим страницу с пустой подпиской

      const currentPlanId = meData.subscription?.plan_id || 'free';
      renderPlans(plans, currentPlanId);
      renderStatus(meData.subscription || null);
      if (meData.transactions?.length) renderReceipt(meData.transactions[0]);

    } catch (e) {
      document.getElementById('plansContainer').innerHTML = `
        <div class="error-state">
          <div class="err-icon">🔌</div>
          <h3>Ошибка подключения</h3>
          <p>${e.message || 'Не удалось соединиться с сервером'}</p>
          <button class="retry-btn" onclick="loadData()">Повторить</button>
        </div>`;
    }
  }

  // ═══════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════
  async function init() {
    let user = getUser();
    if (!user) {
      // Нет пользователя вообще — на логин
      const nextPath = window.location.pathname;
      window.location.href = '/auth.html?tab=login&next=' + encodeURIComponent(nextPath);
      return;
    }

    // Инициализируем навбар (для всех ролей — подписка доступна всем)
    const initials = (user.name || user.username || 'U').charAt(0).toUpperCase();
    document.getElementById('navAvatar').textContent = initials;
    document.getElementById('navUserName').textContent = user.name || user.username || 'Пользователь';

    // Обработка возврата с PayPal
    const params = new URLSearchParams(window.location.search);
    window.history.replaceState(null, '', window.location.pathname);

    if (params.get('pp') === 'cancel') {
      toast('Оплата отменена', 'warn');
    } else if (params.get('token')) {
      await capturePayPal(params.get('token'));
    }

    await loadData();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
