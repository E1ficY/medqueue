<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MedQueue — Подписка</title>
  <meta name="description" content="Управление подпиской MedQueue. Выберите тариф и оплатите через PayPal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=2026-06-11">
  <link rel="stylesheet" href="../css/modules/navigation-system.css?v=2">
  <link rel="stylesheet" href="../css/modules/logo-system.css?v=2">
  <script src="../js/script.js?v=1.0.8"></script>
  <script src="../js/theme.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }



    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }


    /* ─── LAYOUT ─── */
    .page { max-width: 1080px; margin: 0 auto; padding: 40px 20px 80px; }

    .page-hero {
      text-align: center;
      margin-bottom: 48px;
    }
    .page-hero h1 {
      font-size: 40px;
      font-weight: 800;
      background: linear-gradient(135deg, #0f172a 30%, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    [data-theme="dark"] .page-hero h1 {
      background: linear-gradient(135deg, #f8fafc 30%, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-hero p {
      color: var(--muted);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── STATUS BAR ─── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 24px;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
    }
    .status-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(74,222,128,.2), rgba(34,197,94,.1));
      border: 1px solid rgba(74,222,128,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .status-info { flex: 1; }
    .status-plan {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .status-detail {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(74,222,128,.12);
      color: var(--accent);
      border: 1px solid rgba(74,222,128,.2);
    }
    .status-badge.plus { background: rgba(245,158,11,.12); color: #d97706; border-color: rgba(245,158,11,.2); }
    .status-badge.social { background: rgba(129,140,248,.12); color: #6366f1; border-color: rgba(129,140,248,.2); }

    /* ─── PLANS GRID ─── */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 768px) { .plans-grid { grid-template-columns: 1fr; } }

    .plan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color .2s, transform .2s;
      position: relative;
      overflow: hidden;
    }
    .plan-card:hover { border-color: rgba(255,255,255,.15); transform: translateY(-2px); }
    .plan-card.popular {
      border-color: rgba(245,158,11,.4);
      background: linear-gradient(145deg, #fffcf5, #fffbeb);
      box-shadow: 0 4px 24px rgba(245,158,11,.15);
    }
    [data-theme="dark"] .plan-card.popular {
      background: linear-gradient(145deg, #1f2937, #334155);
    }
    .plan-card.active-plan { border-color: rgba(74,222,128,.35); }

    .plan-popular-badge {
      position: absolute; top: 16px; right: 16px;
      font-size: 10px; font-weight: 800;
      padding: 3px 9px; border-radius: 20px;
      background: linear-gradient(90deg, #d97706, #f97316);
      color: #fff;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .plan-name {
      font-size: 13px; font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .plan-price {
      font-size: 34px; font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .plan-price span { font-size: 14px; font-weight: 500; color: var(--muted); }

    .plan-features { list-style: none; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .plan-features li {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 13px; color: var(--muted); line-height: 1.4;
    }
    .plan-features li::before { content: '✓'; color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .plan-card.popular .plan-features li::before { color: #d97706; }

    .plan-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      transition: all .2s;
    }
    .plan-btn.free-btn {
      background: rgba(15,23,42,.04);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .plan-btn.free-btn:hover { background: rgba(15,23,42,.08); }
    .plan-btn.social-btn {
      background: rgba(59,130,246,.1);
      color: var(--accent);
      border: 1px solid rgba(59,130,246,.3);
    }
    .plan-btn.social-btn:hover { background: rgba(59,130,246,.2); }
    .plan-btn.paypal-btn {
      background: linear-gradient(135deg, #003087, #0070ba);
      color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .plan-btn.paypal-btn:hover { background: linear-gradient(135deg, #004ab3, #0070ba); transform: scale(1.02); }
    .plan-btn:disabled {
      opacity: .6; cursor: not-allowed;
      transform: none !important;
    }
    .plan-btn.active-btn {
      background: rgba(59,130,246,.1);
      color: var(--accent);
      border: 1px solid rgba(59,130,246,.25);
      cursor: default;
    }

    /* ─── CARD PAYMENT UI ─── */
    .card-payment-box {
      margin-top: 4px;
      text-align: left;
    }
    .card-payment-divider {
      display: flex; align-items: center; text-align: center; color: var(--muted); font-size: 11px; margin: 12px 0;
    }
    .card-payment-divider::before, .card-payment-divider::after {
      content: ''; flex: 1; border-bottom: 1px solid var(--border);
    }
    .card-payment-divider::before { margin-right: .5em; }
    .card-payment-divider::after { margin-left: .5em; }
    .card-input-group {
      background: rgba(0,0,0,.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    [data-theme="dark"] .card-input-group { background: rgba(255,255,255,.03); }
    .card-input-row {
      display: flex; align-items: center; padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .card-input-row:last-child { border-bottom: none; }
    .card-input-row input {
      background: transparent; border: none; color: var(--text); font-size: 13px; font-family: inherit; width: 100%; outline: none;
    }
    .card-input-row input::placeholder { color: var(--muted); }
    .card-icons { display: flex; gap: 4px; }
    .card-icons img { height: 14px; }
    .card-save-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
    .card-save-row input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); }
    .card-save-row label { font-size: 11px; color: var(--muted); line-height: 1.4; cursor: pointer; }


    /* ─── PAYPAL LOGO ─── */
    .paypal-logo {
      display: inline-flex; align-items: center; gap: 3px;
      font-weight: 800; font-size: 14px;
    }
    .paypal-logo .pay { color: #009cde; }
    .paypal-logo .pal { color: #003087; }

    /* ─── SOCIAL FORM ─── */
    .social-reason-box {
      background: var(--card);
      border: 1px solid rgba(129,140,248,.25);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 32px;
      display: none;
    }
    .social-reason-box.show { display: block; }
    .social-reason-box label {
      display: block;
      font-size: 13px; font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .social-reason-box textarea {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      resize: vertical;
      min-height: 80px;
    }
    .social-reason-box textarea:focus { outline: none; border-color: #6366f1; }
    
    .file-upload-zone {
      border: 2px dashed rgba(59,130,246,.3);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: rgba(59,130,246,.03);
      transition: all 0.2s;
    }
    .file-upload-zone:hover {
      background: rgba(59,130,246,.08);
      border-color: rgba(59,130,246,.5);
    }
    .file-upload-zone .upload-icon { font-size: 28px; margin-bottom: 10px; }
    .file-upload-zone .upload-text { font-size: 14px; color: var(--muted); font-weight: 500; }
    .file-upload-zone.has-file .upload-icon { content: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'; }
    .file-upload-zone.has-file .upload-text { color: #10b981; font-weight: 700; }

    /* ─── RECEIPT ─── */
    .receipt-section { display: none; margin-bottom: 32px; }
    .receipt-section.show { display: block; }
    .receipt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .receipt-header {
      background: linear-gradient(90deg, var(--card), #1a2540);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .receipt-header .title { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .receipt-body { padding: 4px 0; }
    .receipt-row {
      display: flex; justify-content: space-between;
      padding: 10px 20px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-row .label { color: var(--muted); }
    .receipt-row .value { color: var(--text); font-weight: 600; }
    .receipt-row .value.success { color: var(--accent); }

    /* ─── TOAST ─── */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 14px; font-weight: 600;
      color: var(--text);
      max-width: 340px;
      z-index: 9999;
      transform: translateY(20px);
      opacity: 0;
      transition: all .3s ease;
      display: flex; align-items: center; gap: 10px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: rgba(74,222,128,.3); }
    #toast.error { border-color: rgba(239,68,68,.3); }
    #toast .toast-icon { font-size: 18px; flex-shrink: 0; }

    /* ─── LOADING ─── */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(0,0,0,.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--card);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 14px;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    .error-state .err-icon { font-size: 36px; margin-bottom: 12px; }
    .error-state h3 { color: var(--text); margin-bottom: 8px; }
    .error-state p { font-size: 14px; margin-bottom: 16px; }
    .retry-btn {
      padding: 10px 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s;
    }
    .retry-btn:hover { background: rgba(255,255,255,.14); }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body class="page-subscription-avant">



<div id="toast">
  <span class="toast-icon" id="toastIcon">ℹ️</span>
  <span id="toastMsg"></span>
</div>

<main class="page">
  <div class="page-hero">
    <h1>Подписка MedQueue</h1>
    <p>Выберите подходящий тариф и получите доступ к расширенным функциям платформы</p>
  </div>

  <!-- СТАТУС ТЕКУЩЕЙ ПОДПИСКИ -->
  <div class="status-bar" id="statusBar" style="display:none">
    <div class="status-icon" id="statusIcon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg></div>
    <div class="status-info">
      <div class="status-plan" id="statusPlan">Тариф: Free</div>
      <div class="status-detail" id="statusDetail">Загрузка...</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
      <div class="status-badge" id="statusBadge">Free</div>
      <div id="refundBtnWrap" style="display:none;">
        <button id="refundBtn" class="plan-btn" style="padding: 4px 10px; font-size:11px; background:transparent; border:1px solid var(--border); color:var(--muted); width:auto;" onclick="resetDemo()">Возврат средств (Сброс)</button>
      </div>
    </div>
  </div>

  <!-- ПЛАНЫ -->
  <div class="section-title">Доступные тарифы</div>
  <div id="plansContainer">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Загрузка тарифов...</div>
    </div>
  </div>

  <!-- ФОРМА ЛЬГОТНОГО ТАРИФА -->
  <div class="social-reason-box" id="socialBox">
    <label>Загрузите фото льготной карточки (пенсионное, инвалидность и т.д.)</label>
    <div class="file-upload-zone" id="fileUploadZone" onclick="document.getElementById('socialPhoto').click()">
      <div class="upload-icon" id="uploadIcon">📸</div>
      <div class="upload-text" id="uploadText">Нажмите, чтобы выбрать фото</div>
      <input type="file" id="socialPhoto" accept="image/*" style="display:none;" onchange="handleFileUpload(this)">
    </div>
    <!-- Hidden textarea so the backend validation still works (needs >=12 chars) -->
    <textarea id="socialReason" style="display:none;"></textarea>
  </div>

  <!-- ПОСЛЕДНИЙ ПЛАТЕЖ -->
  <div class="receipt-section" id="receiptSection">
    <div class="section-title">Последний платёж</div>
    <div class="receipt-card">
      <div class="receipt-header">
        <span>🧾</span>
        <span class="title">Квитанция об оплате</span>
      </div>
      <div class="receipt-body" id="receiptBody"></div>
    </div>
  </div>
</main>

<script>
  var API = window.location.origin + '/api';
  var AUTH_KEY = 'medqueue_current_user';
  var activePlanId = 'free';
  var isLoggedIn = false;
  var _pollTimer = null;          // polling timer id
  var _wasPendingSocial = false;  // track previous state for change detection

  function getUser() {
    try {
      var u = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      if (!u) return null;
      // OAuth logins store tokens separately - merge them in
      if (!u.access) {
        var sep = localStorage.getItem('medqueue_access_token') || '';
        var sepR = localStorage.getItem('medqueue_refresh_token') || '';
        if (sep) { u.access = sep; u.refresh = sepR; }
      }
      return u;
    } catch(e) { return null; }
  }
  function saveUser(u) {
    localStorage.setItem(AUTH_KEY, JSON.stringify(u));
    // Keep separate keys in sync too
    if (u.access) localStorage.setItem('medqueue_access_token', u.access);
  }

  async function tryRefresh() {
    var u = getUser();
    if (!u || !u.refresh) return false;
    try {
      var r = await fetch(API + '/auth/token/refresh/', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({refresh: u.refresh})
      });
      if (!r.ok) return false;
      var d = await r.json();
      if (!d.access) return false;
      saveUser(Object.assign({}, u, {access: d.access}));
      return true;
    } catch(e) { return false; }
  }

  async function authFetch(url, opts) {
    opts = opts || {};
    var u = getUser();
    var headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
    if (u && u.access) headers['Authorization'] = 'Bearer ' + u.access;
    try {
      var res = await fetch(url, Object.assign({}, opts, {headers: headers}));
      if (res.status === 401) {
        if (await tryRefresh()) {
          var u2 = getUser();
          headers['Authorization'] = 'Bearer ' + u2.access;
          return fetch(url, Object.assign({}, opts, {headers: headers}));
        }
        localStorage.removeItem(AUTH_KEY);
        isLoggedIn = false;
        return null;
      }
      return res;
    } catch(e) { return null; }
  }

  var toastTimer;
  function toast(msg, type) {
    type = type || 'info';
    var t = document.getElementById('toast');
    var i = document.getElementById('toastIcon');
    t.className = 'show ' + type;
    i.innerHTML = type === 'error' ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' : (type === 'success' ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : 'ℹ️');
    document.getElementById('toastMsg').innerHTML = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = t.className.replace('show', ''); }, 4000);
  }

  function requireAuth() {
    if (isLoggedIn) return true;
    sessionStorage.setItem('medqueue_auth_return_url', window.location.href);
    window.location.href = '/auth.html?tab=login';
    return false;
  }

  function renderPlans(plans, currentPlanId, isPendingSocial) {
    activePlanId = currentPlanId || 'free';
    var defs = {free: '🌱', social: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>', plus: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'};
    var html = '<div class="plans-grid">';
    for (var i = 0; i < plans.length; i++) {
      var p = plans[i];
      var isActive = p.id === activePlanId && isLoggedIn;
      // Pending social: show on social card but not as 'active'
      var isPendingThisCard = isPendingSocial && p.id === 'social';
      var icon = defs[p.id] || '⚙️';
      var priceText = p.price_kzt === 0 ? 'Бесплатно' : p.price_kzt.toLocaleString('ru-RU') + ' ₸';
      var priceSub = p.price_kzt === 0 ? '' : '<span>/ месяц</span>';
      var btnContent, btnClass;
      if (isPendingThisCard) {
        btnContent = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l16-20V2z"/></svg> Ожидает проверки...';
        btnClass = 'active-btn';
      } else if (isActive) {
        btnContent = '✓ Текущий тариф';
        btnClass = 'active-btn';
      } else if (p.id === 'plus') {
        btnContent = '<span class="paypal-logo"><span class="pay">Pay</span><span class="pal">Pal</span></span> Оплатить';
        btnClass = 'paypal-btn';
      } else if (p.id === 'social') {
        btnContent = 'Подтвердить льготу';
        btnClass = 'social-btn';
      } else {
        btnContent = isLoggedIn ? 'Выбрать' : 'Войти для выбора';
        btnClass = 'free-btn';
      }
      var benefits = '';
      for (var j = 0; j < p.benefits.length; j++) benefits += '<li>' + p.benefits[j] + '</li>';
      html += '<div class="plan-card' + (p.is_popular ? ' popular' : '') + (isActive ? ' active-plan' : '') + (isPendingThisCard ? ' pending-plan' : '') + '">';
      if (p.is_popular) html += '<div class="plan-popular-badge"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg> Популярный</div>';
      if (isPendingThisCard) html += '<div class="plan-popular-badge" style="background:#f59e0b;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l16-20V2z"/></svg> Ожидает проверки</div>';
      html += '<div class="plan-name">' + icon + ' ' + p.title + '</div>';
      html += '<div class="plan-price">' + priceText + priceSub + '</div>';
      html += '<ul class="plan-features">' + benefits + '</ul>';
      if (p.id === 'plus' && !isActive) {
        html += '<div style="display:flex; flex-direction:column; gap:8px;">';
        
        html += '<label style="display:flex; align-items:flex-start; gap:8px; font-size:11px; color:var(--muted); cursor:pointer; text-align:left; background:rgba(15,23,42,0.03); padding:8px 10px; border-radius:6px; border:1px solid var(--border); margin-bottom:4px;">';
        html += '<input type="checkbox" id="paypalAgreement" style="margin-top:1px; accent-color:var(--primary);">';
        html += '<span>Я подтверждаю оплату и понимаю условия выбранного тарифа.</span>';
        html += '</label>';

        html += '<button id="btn-' + p.id + '" class="plan-btn ' + btnClass + '" onclick="handlePlan(\'' + p.id + '\')">' + btnContent + '</button>';
        
        // Button redirecting to card checkout
        html += '<div class="card-payment-box">';
        html += '<button class="plan-btn" style="background:rgba(255,255,255,0.05); color:var(--text); border:1px solid var(--border);" onclick="window.location.href=\'/card-checkout.html\'">💳 Оплатить картой</button>';
        html += '</div>';

        html += '</div>';
      } else {
        html += '<button id="btn-' + p.id + '" class="plan-btn ' + btnClass + '" onclick="handlePlan(\'' + p.id + '\')"' + (isActive || isPendingThisCard ? ' disabled' : '') + '>' + btnContent + '</button>';
      }
      html += '</div>';
    }
    html += '</div>';
    document.getElementById('plansContainer').innerHTML = html;
    var sb = document.getElementById('socialBox');
    if (sb) sb.classList.toggle('show', isLoggedIn && activePlanId !== 'social');
  }

  function renderStatus(sub, isPendingSocial) {
    var bar = document.getElementById('statusBar');
    if (!isLoggedIn) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    var icons = {free: '🌱', social: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>', plus: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'};
    if (!sub) {
      document.getElementById('statusPlan').textContent = 'Тариф: Free';
      document.getElementById('statusDetail').textContent = 'Активируйте тариф из списка ниже';
      document.getElementById('statusIcon').textContent = '🌱';
      document.getElementById('statusBadge').textContent = 'Free';
      document.getElementById('statusBadge').className = 'status-badge';
      return;
    }

    // Pending social — special display
    if (isPendingSocial) {
      document.getElementById('statusIcon').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l16-20V2z"/></svg>';
      document.getElementById('statusPlan').textContent = 'Тариф: Льготный Care (ожидает проверки)';
      document.getElementById('statusDetail').textContent = 'Ваш документ на проверке у администратора. Вы уведомите как только он будет одобрен.';
      var badge = document.getElementById('statusBadge');
      badge.textContent = 'Ожидает';
      badge.className = 'status-badge';
      badge.style.background = '#f59e0b';
      badge.style.color = '#fff';
      var refundBtnWrap = document.getElementById('refundBtnWrap');
      if (refundBtnWrap) refundBtnWrap.style.display = 'none';
      return;
    }

    document.getElementById('statusIcon').innerHTML = icons[sub.plan_id] || '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>';
    document.getElementById('statusPlan').textContent = 'Тариф: ' + sub.plan_title;
    var billing = sub.next_billing_date
      ? 'Следующее списание: ' + new Date(sub.next_billing_date).toLocaleDateString('ru-RU')
      : 'Бесплатно';
    document.getElementById('statusDetail').textContent = billing;
    var badge = document.getElementById('statusBadge');
    badge.textContent = sub.plan_title;
    badge.className = 'status-badge' + (sub.plan_id === 'plus' ? ' plus' : sub.plan_id === 'social' ? ' social' : '');
    badge.style.background = '';
    badge.style.color = '';

    var refundBtnWrap = document.getElementById('refundBtnWrap');
    if (refundBtnWrap) {
      refundBtnWrap.style.display = (sub.plan_id === 'plus') ? '' : 'none';
    }
  }

  function renderReceipt(tx) {
    if (!tx) return;
    var section = document.getElementById('receiptSection');
    var body = document.getElementById('receiptBody');
    var method = tx.card_last4 ? '**** **** **** ' + tx.card_last4 : (tx.merchant_name || 'PayPal');
    var amount = tx.currency === 'USD'
      ? '$' + Number(tx.amount).toFixed(2) + ' USD'
      : Number(tx.amount).toLocaleString('ru-RU') + ' ' + (tx.currency || 'KZT');
    body.innerHTML =
      '<div class="receipt-row"><span class="label">Статус</span><span class="value success">' + (tx.status === 'paid' ? 'ОПЛАЧЕН ✓' : tx.status.toUpperCase()) + '</span></div>' +
      '<div class="receipt-row"><span class="label">Сумма</span><span class="value">' + amount + '</span></div>' +
      '<div class="receipt-row"><span class="label">Оплата</span><span class="value">' + method + '</span></div>' +
      '<div class="receipt-row"><span class="label">ID</span><span class="value" style="font-size:11px;word-break:break-all">' + (tx.transaction_ref || '—') + '</span></div>' +
      '<div class="receipt-row"><span class="label">Дата</span><span class="value">' + (tx.paid_at ? new Date(tx.paid_at).toLocaleString('ru-RU') : '—') + '</span></div>';
    section.classList.add('show');
  }

  function handleFileUpload(input) {
    if (input.files && input.files[0]) {
      var file = input.files[0];
      // Convert to base64 so the backend can store and admin can view the image
      var reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('socialReason').value = e.target.result;
        document.getElementById('uploadIcon').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        document.getElementById('uploadText').textContent = 'Файл прикреплён: ' + file.name;
        document.getElementById('fileUploadZone').classList.add('has-file');
      };
      reader.readAsDataURL(file);
    }
  }

  async function handlePlan(planId) {
    if (!requireAuth()) return;
    if (planId === activePlanId && isLoggedIn) return;
    if (planId === 'plus') { await startPayPal(); return; }
    if (planId === 'social') {
      var reason = (document.getElementById('socialReason').value || '').trim();
      if (reason.length < 12) {
        toast('Пожалуйста, прикрепите фото вашей льготной карточки', 'warn');
        document.getElementById('socialBox').classList.add('show');
        return;
      }
      await activatePlan(planId, {social_reason: reason});
      return;
    }
    await activatePlan(planId, {});
  }

  async function activatePlan(planId, extra) {
    var btn = document.getElementById('btn-' + planId);
    if (btn) { btn.disabled = true; btn.textContent = 'Обработка...'; }
    var payload = JSON.stringify(Object.assign({plan_id: planId}, extra || {}));
    var r = await authFetch(API + '/subscription/activate/', {method: 'POST', body: payload});
    if (!r) { toast('Сессия истекла. Войдите снова', 'warn'); if (btn) btn.disabled = false; return; }
    var d = await r.json();
    if (!r.ok) { toast(d.error || 'Ошибка активации', 'error'); if (btn) btn.disabled = false; return; }
    if (d.pending_review) {
      toast('Заявка отправлена! Администратор проверит ваш документ и активирует льготу.', 'success');
    } else {
      toast(d.message || 'Тариф активирован!', 'success');
    }
    await loadData();
  }

  async function resetDemo() {
    var reason = prompt('Отмена тарифа. Пожалуйста, укажите причину (минимум 5 символов):');
    if (reason === null) return;
    if (reason.trim().length < 5) {
      alert('Пожалуйста, укажите более подробную причину.');
      return;
    }

    var btn = document.getElementById('refundBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Обработка...'; }
    var r = await authFetch(API + '/subscription/reset-demo/', {
      method: 'POST',
      body: JSON.stringify({ reason: reason.trim() })
    });
    if (!r) { toast('Ошибка сессии', 'warn'); if (btn) { btn.disabled = false; btn.textContent = 'Возврат средств (Сброс)'; } return; }
    var d = await r.json();
    if (!r.ok) { toast(d.error || 'Ошибка сброса', 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Возврат средств (Сброс)'; } return; }
    toast(d.message || 'Тариф отменён и данные очищены', 'success');
    if (btn) { btn.disabled = false; btn.textContent = 'Возврат средств (Сброс)'; }
    await loadData();
  }

  async function startPayPal() {
    var agree = document.getElementById('paypalAgreement');
    if (agree && !agree.checked) {
      toast('Необходимо подтвердить согласие с условиями тарифа', 'warn');
      return;
    }
    
    var btn = document.getElementById('btn-plus');
    if (btn) { btn.disabled = true; btn.textContent = 'Переход к PayPal...'; }
    var r = await authFetch(API + '/subscription/create-paypal-order/', {
      method: 'POST',
      body: JSON.stringify({plan_id: 'plus', success_url: window.location.origin + '/subscription.html?pp=1', cancel_url: window.location.origin + '/subscription.html?pp=cancel'})
    });
    if (!r) { toast('Ошибка сессии', 'error'); if (btn) btn.disabled = false; return; }
    var d = await r.json();
    if (!r.ok || !d.checkout_url) { toast(d.error || 'Ошибка PayPal', 'error'); if (btn) btn.disabled = false; return; }
    window.location.href = d.checkout_url;
  }

  async function capturePayPal(token) {
    toast('Подтверждаем платёж...', 'info');
    var r = await authFetch(API + '/subscription/capture-paypal-order/', {method: 'POST', body: JSON.stringify({token: token})});
    if (!r) { toast('Ошибка сессии', 'error'); return; }
    var d = await r.json();
    toast(r.ok ? 'Оплата успешна! Тариф Plus активирован.' : (d.error || 'Ошибка PayPal'), r.ok ? 'success' : 'error');
    if (r.ok) await loadData();
  }

  async function loadData() {
    var plans = [];
    try {
      var pr = await fetch(API + '/subscription/plans/');
      if (pr.ok) { var pd = await pr.json(); plans = Array.isArray(pd) ? pd : (pd.plans || []); }
    } catch(e) {}

    if (!plans.length) {
      document.getElementById('plansContainer').innerHTML =
        '<div class="error-state"><div class="err-icon">🔌</div><h3>Сервер недоступен</h3><p>Не удалось загрузить тарифы. Обновите страницу.</p><button class="retry-btn" onclick="loadData()">Повторить</button></div>';
      return;
    }

    var meData = {subscription: null, transactions: []};
    if (isLoggedIn) {
      var meRes = await authFetch(API + '/subscription/me/');
      if (meRes && meRes.ok) {
        meData = await meRes.json();
        var u = getUser();
        if (u) {
          u.subscription_plan = meData.subscription ? meData.subscription.plan_id : 'free';
          saveUser(u);
        }
      } else if (meRes && meRes.status === 403) {
        document.getElementById('plansContainer').innerHTML =
          '<div class="error-state"><div class="err-icon"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>Доступ запрещен</h3><p>Оформление подписки доступно только для обычных пользователей (пациентов).</p></div>';
        var sb = document.getElementById('socialBox');
        if (sb) sb.style.display = 'none';
        return;
      } else if (!meRes) {
        isLoggedIn = false;
        toast('Сессия истекла. Войдите снова для управления подпиской.', 'warn');
      }
    }

    var sub = isLoggedIn ? (meData.subscription || null) : null;
    // A social plan is only truly "active" once confirmed by admin
    var isPendingSocial = sub && sub.plan_id === 'social' && !sub.social_reason_confirmed_at;

    // REAL-TIME: detect transition from pending → approved
    if (_wasPendingSocial && !isPendingSocial && sub && sub.plan_id === 'social') {
      // Admin just approved! Show celebration
      toast('🎉 Ваша льгота одобрена администратором! Тариф «Льготный Care» активирован.', 'success');
      // Pulse animation on status bar
      var bar = document.getElementById('statusBar');
      if (bar) { bar.style.transition = 'transform 0.3s'; bar.style.transform = 'scale(1.02)'; setTimeout(() => bar.style.transform = '', 400); }
    }
    if (_wasPendingSocial && sub && sub.plan_id === 'free' && !isPendingSocial) {
      // Admin rejected
      toast('Заявка отклонена администратором. Пожалуйста, обратитесь в поддержку.', 'error');
    }
    _wasPendingSocial = !!isPendingSocial;

    var currentPlanId = isLoggedIn ? (sub ? (isPendingSocial ? 'pending_social' : sub.plan_id) : 'free') : null;
    renderPlans(plans, currentPlanId, isPendingSocial);
    renderStatus(sub, isPendingSocial);
    if (meData.transactions && meData.transactions.length) renderReceipt(meData.transactions[0]);

    // REAL-TIME POLLING: always poll when logged in to catch any server-side changes
    if (isLoggedIn && !_pollTimer) {
      var _lastPlanId = sub ? sub.plan_id : 'free';
      var _lastConfirmed = sub ? sub.social_reason_confirmed_at : null;
      _pollTimer = setInterval(async function() {
        try {
          var r = await authFetch(API + '/subscription/me/');
          if (!r || !r.ok) return;
          var d = await r.json();
          var s = d.subscription || null;
          var newPlanId = s ? s.plan_id : 'free';
          var newConfirmed = s ? s.social_reason_confirmed_at : null;
          // Re-render only if something actually changed
          if (newPlanId !== _lastPlanId || newConfirmed !== _lastConfirmed) {
            _lastPlanId = newPlanId;
            _lastConfirmed = newConfirmed;
            clearInterval(_pollTimer); _pollTimer = null;
            var u2 = getUser();
            if (u2) {
              u2.subscription_plan = newPlanId;
              saveUser(u2);
            }
            await loadData();
          }
        } catch(e) {}
      }, 3000);
    }
  }


  async function init() {
    var user = getUser();
    isLoggedIn = !!(user && user.access);

    var params = new URLSearchParams(window.location.search);
    window.history.replaceState(null, '', window.location.pathname);
    if (params.get('pp') === 'cancel') {
      toast('Оплата отменена', 'warn');
    } else if (params.get('token') && isLoggedIn) {
      await capturePayPal(params.get('token'));
    }

    await loadData();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
