services:
  db:
    image: postgres:15-alpine
    container_name: medqueue-db
    environment:
      POSTGRES_DB: medqueue
      POSTGRES_USER: medqueue
      POSTGRES_PASSWORD: medqueue
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medqueue-backend
    env_file:
      - backend/.env
    environment:
      DEBUG: "False"
      DB_ENGINE: "postgres"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: medqueue
      POSTGRES_USER: medqueue
      POSTGRES_PASSWORD: medqueue
      CACHE_URL: "redis://redis:6379/1"
      ALLOWED_HOSTS: "localhost,127.0.0.1,46.101.126.48,medqueue.me,www.medqueue.me"
      FRONTEND_DIR: "/frontend"
      ENABLE_SSL_REDIRECT: "True"
    depends_on:
      - db
      - redis
    volumes:
      - staticfiles:/app/staticfiles
      - ./html:/frontend/html:ro
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medqueue-worker
    env_file:
      - backend/.env
    command: celery -A medqueue_project worker --loglevel=info
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medqueue-redis
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: medqueue-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/staticfiles:ro
      - ./html:/frontend/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/letsencrypt-www:/var/www/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  staticfiles:
