services:
  db:
    image: postgres:15-alpine
    container_name: medqueue-db
    environment:
      POSTGRES_DB: medqueue
      POSTGRES_USER: medqueue
      POSTGRES_PASSWORD: medqueue
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medqueue-backend
    env_file:
      - backend/.env
    environment:
      DEBUG: "False"
      DB_ENGINE: "postgres"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: medqueue
      POSTGRES_USER: medqueue
      POSTGRES_PASSWORD: medqueue
      CACHE_URL: "redis://redis:6379/1"
      ALLOWED_HOSTS: "localhost,127.0.0.1,46.101.126.48,medqueue.me,www.medqueue.me,backend"
      FRONTEND_DIR: "/frontend"
      ENABLE_SSL_REDIRECT: "True"
    depends_on:
      - db
      - redis
    volumes:
      - staticfiles:/app/staticfiles
      - ./html:/frontend/html:ro
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medqueue-worker
    env_file:
      - backend/.env
    command: celery -A medqueue_project worker --loglevel=info
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medqueue-redis
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: medqueue-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/staticfiles:ro
      - ./html:/frontend/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/letsencrypt-www:/var/www/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped

  # ── Monitoring Stack ─────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: medqueue-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules:/etc/prometheus/alert.rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: medqueue-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: medqueue2024
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://medqueue.me/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: medqueue-alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: medqueue-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    restart: unless-stopped

volumes:
  db_data:
  staticfiles:
  prometheus_data:
  grafana_data:
