<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FD1C5"></stop>
      <stop offset="100%" stop-color="#3182CE"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="#F7FAFC"></rect>

  <!-- Medical cross -->
  <rect x="176" y="96" width="160" height="320" rx="40" fill="url(#grad)"></rect>
  <rect x="96" y="176" width="320" height="160" rx="40" fill="url(#grad)"></rect>

  <!-- Door -->
  <rect x="216" y="156" width="80" height="200" rx="20" fill="#FFFFFF" opacity="0.95"></rect>
  <rect x="244" y="180" width="24" height="24" rx="6" fill="#3182CE"></rect>

  <!-- Queue figures -->
  <g fill="#FFFFFF">
    <circle cx="170" cy="300" r="18"></circle>
    <rect x="155" y="320" width="30" height="60" rx="15"></rect>

    <circle cx="230" cy="280" r="18"></circle>
    <rect x="215" y="300" width="30" height="80" rx="15"></rect>

    <circle cx="290" cy="260" r="18"></circle>
    <rect x="275" y="280" width="30" height="100" rx="15"></rect>
  </g>

  <!-- Queue line -->
  <path d="M140 340 Q200 360 260 330 Q300 310 320 320" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"></path>

</svg>