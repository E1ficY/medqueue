version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medqueue-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
    command: gunicorn medqueue_project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
