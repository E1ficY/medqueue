<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MedQueue MQ mark</title>
  <desc id="desc">Serif monogram mark in neutral beige and black palette.</desc>

  <defs>
    <style>
      .bg { fill: #eee9df; }
      .frame { fill: none; stroke: #121318; stroke-width: 4; }
      .mono {
        fill: #121318;
        font-family: "Iowan Old Style", "Bodoni MT", "Didot", "Times New Roman", serif;
        font-size: 250px;
        font-weight: 700;
        letter-spacing: -6px;
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="512" height="512" rx="56" />
  <rect class="frame" x="28" y="28" width="456" height="456" rx="42" />
  <text class="mono" x="92" y="322">MQ</text>
</svg>
