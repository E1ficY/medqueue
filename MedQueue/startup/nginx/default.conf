server {
    listen 80;
    server_name _;

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    location /css/ {
        alias /staticfiles/css/;
        access_log off;
        expires 30d;
    }

    location /js/ {
        alias /staticfiles/js/;
        access_log off;
        expires 30d;
    }

    location /images/ {
        alias /staticfiles/images/;
        access_log off;
        expires 30d;
    }

    location /video/ {
        alias /staticfiles/video/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
