name: MedQueue Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: startup/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Use 3.12 for compatibility with database client packages
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'startup/backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
        continue-on-error: false

      - name: Run Migrations
        run: |
          python manage.py migrate --noinput || echo "Migrations warning (expected for fresh test DB)"

      - name: Run Test Suite
        run: |
          python manage.py test appointments.tests --verbosity 2
        continue-on-error: false
