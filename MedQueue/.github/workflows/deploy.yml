name: MedQueue Deploy

on:
  push:
    branches: ["staging", "main"]

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        if: "${{ secrets.STAGING_HOST && secrets.STAGING_USER && secrets.STAGING_SSH_KEY }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/medqueue
            git fetch --all
            git checkout staging
            git pull origin staging
            # Run migrations on the remote before restarting services
            docker compose -f startup/docker-compose.yml run --rm backend python manage.py migrate --noinput || true
            docker compose -f startup/docker-compose.yml up -d --build
      - name: Skip staging deploy when secrets missing
        if: "${{ !secrets.STAGING_HOST || !secrets.STAGING_USER || !secrets.STAGING_SSH_KEY }}"
        run: |
          echo "Staging deploy secrets are not set; skipping staging deploy."
          exit 0

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        if: "${{ secrets.PROD_HOST && secrets.PROD_USER && secrets.PROD_SSH_KEY }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/medqueue
            git fetch --all
            git checkout main
            git pull origin main
            # Run migrations on the remote before restarting services
            docker compose -f startup/docker-compose.yml run --rm backend python manage.py migrate --noinput || true
            docker compose -f startup/docker-compose.yml up -d --build
      - name: Skip production deploy when secrets missing
        if: "${{ !secrets.PROD_HOST || !secrets.PROD_USER || !secrets.PROD_SSH_KEY }}"
        run: |
          echo "Production deploy secrets are not set; skipping production deploy."
          exit 0
